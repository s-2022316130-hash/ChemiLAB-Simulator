<title>ChemiLAB — hero film capture</title>

<!--
  A virtual clock, installed before any module loads. The plant animates on
  requestAnimationFrame and performance.now; here both are driven by
  __clock.step(ms) instead of by the display, so every frame of the film is
  exactly one thirtieth of a second after the last however long it took to
  render. The quality governor measures work with the same clock, sees none,
  and holds the top tier throughout.
-->
<script>
(() => {
  let now = 0, id = 0;
  const queue = new Map();
  performance.now = () => now;
  window.requestAnimationFrame = cb => { queue.set(++id, cb); return id; };
  window.cancelAnimationFrame = i => { queue.delete(i); };
  window.__clock = {
    step(ms) {
      now += ms;
      const due = [...queue.values()];
      queue.clear();
      for (const cb of due) cb(now);
    },
    get now() { return now; }
  };
})();
document.documentElement.dataset.theme = 'dark';
</script>
