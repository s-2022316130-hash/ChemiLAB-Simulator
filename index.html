<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="description" content="ChemiLAB Simulator: an interactive chemical-engineering virtual plant and process simulation laboratory." />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#f2f6fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b101a" media="(prefers-color-scheme: dark)" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ChemiLAB Simulator — Chemical Engineering Virtual Plant</title>
<!-- Theme before first paint. Without this the page flashes the default theme
     for one frame on every load, which is the most visible bug a theme can have. -->
<script>
  try {
    var t = localStorage.getItem('chemilab.theme.v1');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    document.documentElement.style.colorScheme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<!-- Fonts are bundled (src/shared/fonts.css), not fetched from Google: that
     request timed out on some networks and could never work offline. -->
<link rel="stylesheet" href="./src/shared/fonts.css" />
<link rel="stylesheet" href="./src/shared/theme.css" />
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
