<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="description" content="ChemiLAB Simulator: an interactive chemical-engineering virtual plant and process simulation laboratory." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ChemiLAB Simulator — Chemical Engineering Virtual Plant</title>
<!-- Theme before first paint. Without this the page flashes the default theme
     for one frame on every load, which is the most visible bug a theme can have. -->
<script>
  try {
    var t = localStorage.getItem('chemilab.theme.v1');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.documentElement.style.colorScheme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="./src/shared/theme.css" />
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
